
workflows:
  firsat-avcisi-android:
    name: Firsat Avcisi Android APK
    max_build_duration: 60
    instance_type: linux

    environment:
      java: 17

    scripts:
      - name: Extract Android project
        script: |
          unzip -q FirsatAvcisi-Android-MVP.zip -d source

      - name: Fix Java and Kotlin targets
        script: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions {" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """, 1)

          if "kotlinOptions {" not in s:
              s = s.replace(
                  "android {",
                  """android {
              kotlinOptions {
                  jvmTarget = "17"
              }
          """, 1)

          p.write_text(s)
          print("Java ve Kotlin hedefleri 17 olarak ayarlandı.")
          PY

      - name: Download Gradle 8.9
        script: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp

      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > source/local.properties

      - name: Build Android APK
        script: |
          cd source
          /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug

    artifacts:
      - source/app/build/outputs/apk/debug/app-debug.apk
