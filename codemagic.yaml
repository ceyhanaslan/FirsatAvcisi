
workflows:
  firsat-avcisi-android:
    name: Firsat Avcisi Android APK
    max_build_duration: 60
    instance_type: linux

    environment:
      java: 17

    scripts:
      - name: Extract Android project
        script: |
          unzip -q FirsatAvcisi-Android-MVP.zip -d source

      - name: Generate Gradle 8.9 wrapper
        script: |
          mkdir -p "$CM_BUILD_DIR/wrapper-bootstrap"
          cd "$CM_BUILD_DIR/wrapper-bootstrap"
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          cp gradlew "$CM_BUILD_DIR/source/"
          cp -R gradle "$CM_BUILD_DIR/source/"
          chmod +x "$CM_BUILD_DIR/source/gradlew"

      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/source/local.properties"

      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR/source"
          ./gradlew --no-daemon :app:assembleDebug

    artifacts:
      - source/app/build/outputs/apk/debug/app-debug.apk
