
    scripts:
      - name: Extract Android project
        script: |
          unzip -q FirsatAvcisi-Android-MVP.zip -d source

      - name: Download Gradle 8.9
        script: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > source/local.properties

      - name: Build APK
        script: |
          cd source
          /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug

    artifacts:
      - source/app/build/outputs/apk/debug/app-debug.apk
